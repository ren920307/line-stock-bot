name: Keep Alive

on:
  schedule:
    # 每 10 分鐘，台北時間週一到週五 08:00–17:00（UTC 00:00–09:00）
    - cron: "*/10 0-8 * * 1-5"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -sf --max-time 30 https://line-stock-bot-a54m.onrender.com/ \
            && echo "Render 在線" \
            || echo "Ping 失敗（可能正在喚醒）"
