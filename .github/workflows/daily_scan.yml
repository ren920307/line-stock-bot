name: Daily Scan

on:
  schedule:
    - cron: "0 7 * * 1-5"  # 台灣時間 15:00，週一到週五
  workflow_dispatch:          # 手動觸發

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render
        run: curl -s --max-time 60 https://line-stock-bot-a54m.onrender.com/ || true

      - name: Wait for service ready
        run: sleep 45

      - name: Run daily scan
        run: |
          curl -s --max-time 120 https://line-stock-bot-a54m.onrender.com/daily-scan
